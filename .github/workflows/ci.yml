# Three jobs. build-and-test -- the Linux CPU build of all three binary pairs (single, DOUBLE=1, DIM=2)
# and the test battery through tests/ci_suite.sh, the SAME list the Dockerfile runs, so the two cannot
# drift (this job is CPU-only: it exists to catch "does not compile on Linux", "the deposit broke" and
# "the GUI no longer runs what it shows" regressions). The Metal GPU path is macOS-only and validated locally
# (tests/dtfe_metal_check.sh, tests/gpu_scalar_check.sh, tests/gpu_mass_check.sh, metal/validate_deposit.cpp).
# old-python -- every .py parses under Python 3.10, the oldest pyproject supports (ci_suite's own check
# skips on the runner, which has no 3.10, so without this job a PEP 701 f-string could pass CI).
# compile-variants -- what users build beyond the pairs: no TBB and no libdeflate (neither installed),
# 'make library' and the demo/examples program linked against it (tests/ci_suite.sh variants).
# The GPU code is Metal-only, so no job here builds a GPU backend (the retired CUDA/HIP port lives on the branch
# archive/cuda-hip-2026-11-08).
# The C++ jobs share their compiler output through ccache (Debian's /usr/lib/ccache masquerade: the
# Makefile's 'which g++' finds it first on PATH, so nothing in the Makefile changes).

name: ci

# The working branch is Phase-Space, so the workflow runs on it as well as on master and pull
# requests. workflow_dispatch adds a manual "Run workflow" button.
on:
  push:
    branches: [master, Phase-Space]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # the single-precision battery alone outgrows 60 min on the 4-core runner (locally it is 18 min on 10 cores),
    # and the double and 2D passes come after it
    timeout-minutes: 150
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgsl-dev libcgal-dev libtbb-dev \
            libboost-dev libboost-thread-dev libboost-filesystem-dev libboost-program-options-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libfftw3-dev libdeflate-dev \
            python3 python3-numpy python3-h5py python3-scipy python3-matplotlib ccache
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"   # what the cache step saves (~ is not expanded in env:)

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-build-and-test-${{ hashFiles('Makefile', 'src/**') }}
          restore-keys: ccache-build-and-test-

      # single + DOUBLE=1 + DIM=2: each is a separate compile of every translation unit, so only a
      # build catches a float-only or 3D-only construct creeping in
      - name: Build the single, double and 2D binaries (CPU-only)
        run: tests/ci_suite.sh build

      # every CPU suite against ./DTFE and ./PS-DTFE (tests/ci_suite.sh lists them, with why), the
      # standard-DTFE regression against its STORED reference and the auto-tune and --scratch-dir
      # suites (free of macOS-only commands) included
      - name: Test battery (single precision)
        run: tests/ci_suite.sh core

      # The GUI (python/gui). The job-spec test is pure Python; the end-to-end test drives the real
      # window offscreen through REAL runs of every tab on synthetic data (the Data tab through a
      # fake wget, so no network), which needs PySide6 (in a venv: Ubuntu's python refuses pip), the
      # libraries of Qt's offscreen platform, and matplotlib + scipy for the plot scripts.
      # DTFE_GUI_TEST_REQUIRED=1 (set by ci_suite.sh) turns its "PySide6 missing" skip into a failure.
      - name: GUI job specifications + end-to-end (PySide6, offscreen)
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-matplotlib python3-scipy \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64
          python3 -m venv --system-site-packages "$RUNNER_TEMP/gui-venv"
          "$RUNNER_TEMP/gui-venv/bin/pip" install --quiet PySide6
          DTFE_GUI_PYTHON="$RUNNER_TEMP/gui-venv/bin/python" tests/ci_suite.sh gui

      # the double pair against the single pair, then the program-running suites again against the
      # double pair (DTFE_TEST_PRECISION=double reads their float64 grids; tests/precision.sh)
      - name: Test battery (double precision)
        run: tests/ci_suite.sh double

      - name: 2D phase space against analytic 2D flows
        run: tests/ci_suite.sh 2d

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

  old-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # update-environment false: the 3.10 stays OFF the PATH (it has no numpy); the stage is handed its path
      - id: py310
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          update-environment: false
      - name: Every .py parses under Python 3.10
        run: OLD_PYTHON="${{ steps.py310.outputs.python-path }}" tests/ci_suite.sh oldpy
      # unused imports and locals, undefined names (ruff's pyflakes rules); third_party/ is vendored code
      - name: Python static check (ruff, pyflakes rules)
        run: pipx run ruff==0.17.1 check --select F --extend-exclude third_party .

  compile-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      # deliberately WITHOUT libtbb-dev and libdeflate-dev: the build must not need them
      - name: Install dependencies (no TBB, no libdeflate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgsl-dev libcgal-dev \
            libboost-dev libboost-thread-dev libboost-filesystem-dev libboost-program-options-dev \
            libmpfr-dev libhdf5-dev libgmp-dev libfftw3-dev ccache \
            python3 python3-numpy python3-h5py   # the user-sampling part of tests/dtfe_sampling_check.sh
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"   # what the cache step saves (~ is not expanded in env:)
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-compile-variants-${{ hashFiles('Makefile', 'src/**', 'demo/examples/**') }}
          restore-keys: ccache-compile-variants-
      - name: TBB=0 LIBDEFLATE=0 build, make library, the demo/examples program
        run: tests/ci_suite.sh variants
      - name: Compiler cache statistics
        if: always()
        run: ccache -s
