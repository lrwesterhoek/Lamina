# A sample configuration file: './DTFE -c config.cfg' (or '--config'). The keys are the long option names without
# the '--'; the command line wins over the file. (The older keys inputFile, outputFile, method, regionMpc are
# deprecated: still read for one release, with a warning.)

# Input data file and output file name
input-file = bla.txt
output-file = test.dat


# Grid size, must give the grid size along each axis separately - the same as giving '--grid 128 64 32' at the command line
grid = 128      # for x direction
grid = 64       # for y direction
grid = 32       # for z direction


# Box dimensions (can uncomment this is box dimensions are read from the input file) - the same as giving '--box 0. 100. 10. 20. 10. 50.' at the command line
box = 0.        # xMin for the box
box = 100.      # xMax for the box
box = 10.       # yMin for the box
box = 20.       # yMax for the box
box = 10.       # zMin for the box
box = 50.       # zMax for the box


# Set periodic box (don't give a value since it does not look for one) - same as '--periodic' on the command line
periodic = 


# Choose the quantities to be computed (again must give each field on a separate line) - same as '--field density velocity shear' at the command line
field = density
field = velocity
field = shear


# Specify to compute the fields to grid only in a given region - the same as '--region 0 0.25 0.1 0.2 0 0.25' at the command line
region = 0.     # xMin for the region of interest as a ratio with respect to the box length along x direction
region = 0.25   # xMax for the region of interest
region = 0.1    # yMin for the region of interest as a ratio with respect to the box length along y direction
region = 0.2    # yMax for the region of interest
region = 0.     # zMin for the region of interest as a ratio with respect to the box length along z direction
region = 0.25   # zMax for the region of interest
# Or specify the region coordinates in Mpc (not as ratios with respect to the box length as shown above)
#region-mpc = 0.     # xMin in Mpc
#region-mpc = 100.   # xMax in Mpc
#region-mpc = 20.    # yMin in Mpc
#region-mpc = 30.    # yMax in Mpc
#region-mpc = 0.     # zMin in Mpc
#region-mpc = 20.    # zMax in Mpc


# Specify the partition of data due to RAM limitations - the same as '--partition 2 2 1' at the command line
partition = 2   # number of partitions along x-axis
partition = 2   # number of partitions along y-axis
partition = 1   # number of partitions along z-axis


# Some options for computing the density: the Monte-Carlo cell average (method 2: random points, seeded) with
# k = 3 sampling points per axis, 27 per cell - the same as '--average-method 2 --subsamples 3 --seed 123'. Giving a
# method or a count selects the sampled average ('--sampled'); without them the cells are integrated exactly
# ('--exact', the default)
seed = 123
average-method = 2
subsamples = 3


# Some additional options
#verbose = 0